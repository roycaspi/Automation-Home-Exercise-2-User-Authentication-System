<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth & Reset</title>


  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Minimal view‐switcher styling */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="card auth-card">
      <div id="login-view" class="view active">
        <h2 class="card-title">Login</h2>
        <form id="login-form" class="form" autocomplete="off">
          <label>
            <span>Email</span>
            <input
              type="email"
              id="login-email"
              placeholder="you@example.com"
              autocomplete="off"
              required
            />
          </label>
          <label>
            <span>Password</span>
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="login-remember" />
            <span>Remember me</span>
          </label>
          <button type="submit" class="button primary">Log In</button>
        </form>
        <div class="links-row">
          <button class="link-btn" id="show-reset-request">
            Forgot Password?
          </button>
          <span class="separator">|</span>
          <button class="link-btn" id="show-register">Register</button>
        </div>
      </div>

      <div id="register-view" class="view">
        <h2 class="card-title">Register</h2>
        <form id="register-form" class="form" autocomplete="off">
          <label>
            <span>Email</span>
            <input
              type="email"
              id="register-email"
              placeholder="you@example.com"
              autocomplete="off"
              required
            />
          </label>
          <label>
            <span>Password</span>
            <input
              type="password"
              id="register-password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            <span>Confirm Password</span>
            <input
              type="password"
              id="register-confirm"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </label>
          <button type="submit" class="button primary">Register</button>
        </form>
        <div class="links-row">
          <button class="link-btn" id="show-login-from-register">
            Back to Login
          </button>
        </div>
      </div>

      <div id="reset-request-view" class="view">
        <h2 class="card-title">Forgot Password</h2>
        <p class="card-subtitle">
          Enter your email below. We’ll send a link to reset your password.
        </p>
        <form id="reset-request-form" class="form" autocomplete="off">
          <label>
            <span>Email</span>
            <input
              type="email"
              id="reset-email"
              placeholder="you@example.com"
              autocomplete="off"
              required
            />
          </label>
          <button type="submit" class="button primary">
            Send Reset Link
          </button>
        </form>
        <div class="links-row">
          <button class="link-btn" id="show-login-from-reset">
            Back to Login
          </button>
        </div>
      </div>

      <div id="reset-password-view" class="view">
        <h2 class="card-title">Set New Password</h2>
        <form id="reset-password-form" class="form" autocomplete="off">
          <label>
            <span>New Password</span>
            <input
              type="password"
              id="new-password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </label>
          <label>
            <span>Confirm Password</span>
            <input
              type="password"
              id="confirm-password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
          </label>
          <button type="submit" class="button primary">
            Reset Password
          </button>
        </form>
        <div class="links-row">
          <button class="link-btn" id="show-login-from-resetpw">
            Back to Login
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function showView(viewId) {
      document.querySelectorAll('.view').forEach((el) => {
        el.classList.remove('active');
      });
      document.getElementById(viewId).classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document
        .getElementById('show-reset-request')
        .addEventListener('click', () => showView('reset-request-view'));

      document
        .getElementById('show-register')
        .addEventListener('click', () => showView('register-view'));

      document
        .getElementById('show-login-from-register')
        .addEventListener('click', () => showView('login-view'));

      document
        .getElementById('show-login-from-reset')
        .addEventListener('click', () => showView('login-view'));

      document
        .getElementById('show-login-from-resetpw')
        .addEventListener('click', () => showView('login-view'));

      // If URL contains ?token=, jump to reset‐password form:
      const params = new URLSearchParams(window.location.search);
      if (params.has('token')) {
        showView('reset-password-view');
      }
    });
  </script>
</body>
</html>
